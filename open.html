<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For My Love ❤️</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: pink;
            background-image: url('https://i.imgur.com/8fK4h6R.png'); /* heart pattern */
            background-size: cover;
        }

        .love-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);

            border-radius: 20px;
            box-shadow: 0 0 20px red;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: red;
            font-size: 40px;
        }

        p {
            font-size: 22px;
            color: #d10068;
        }
    </style>
</head>

<body>

<div class="love-box">
    <h1>I LOVE YOU ❤️ PUKKI</h1>
    <p>Pratyusha, you mean everything to me 💖</p>
</div>

</body>
</html>
